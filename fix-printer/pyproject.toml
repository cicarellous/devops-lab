[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "fix-printer"
dynamic = ["version"]
description = "Decode and print FIX 4.2 and 4.4 messages, follow orders, and measure gateway latency."
authors = [{name = "cicarellous"}]
maintainers = [{name = "cicarellous"}]
readme = "README.md"
requires-python = ">=3.12"
license = "MIT AND LicenseRef-QuickFIX"
license-files = ["LICENSE", "NOTICE", "fix_printer/dictionaries/LICENSE"]
keywords = ["fix", "trading", "logs", "cli"]
classifiers = [
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Logging",
]

[project.optional-dependencies]
dev = ["build>=1.2", "ruff==0.11.13"]

[project.scripts]
fix-printer = "fix_printer.cli:run_cli"

[project.urls]
Repository = "https://github.com/cicarellous/devops-lab"
Documentation = "https://github.com/cicarellous/devops-lab/tree/main/fix-printer"
Issues = "https://github.com/cicarellous/devops-lab/issues"

[tool.setuptools]
packages = ["fix_printer"]
include-package-data = false

[tool.setuptools.package-data]
fix_printer = ["dictionaries/FIX42.xml", "dictionaries/FIX44.xml", "dictionaries/LICENSE"]

[tool.setuptools.dynamic]
version = {attr = "fix_printer._version.__version__"}

[tool.ruff]
target-version = "py312"
