name: Publish Log Triage release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: log-triage

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test and build the bundle
        run: |
          python -m unittest -q
          python -m pip install build
          python -m build
          python build_bundle.py

      - name: Verify the wheel offline
        run: |
          python -m venv "$RUNNER_TEMP/log-triage-release"
          "$RUNNER_TEMP/log-triage-release/bin/python" -m pip install --no-index --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/log-triage-release/bin/log-triage" --version
          "$RUNNER_TEMP/log-triage-release/bin/log-triage" | grep -Fx 'ERROR: 5'

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c 'from log_triage._version import __version__; print(__version__)')
          gh release create "log-triage-v$version" \
            "dist/log-triage-$version-bundle.zip" \
            "dist/log_triage-$version-py3-none-any.whl" \
            --target "$GITHUB_SHA" \
            --title "Log Triage $version" \
            --notes "Download the bundle ZIP for the offline wheel, analyst guides, sample logs, and license. Extract it and start with README.md. Python 3.12 or later required."
