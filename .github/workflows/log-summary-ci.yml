name: Log Summary CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit tests / ${{ matrix.platform }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Ubuntu
            runner: ubuntu-latest
            python: "3.12"
          - platform: Windows
            runner: windows-latest
            python: "3.12"
          - platform: Ubuntu
            runner: ubuntu-latest
            python: "3.13"
          - platform: Ubuntu
            runner: ubuntu-latest
            python: "3.14"
          - platform: Windows
            runner: windows-latest
            python: "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install coverage.py
        if: matrix.platform == 'Ubuntu' && matrix.python == '3.14'
        run: python -m pip install coverage==7.13.5

      - name: Run Log Summary unit tests
        id: unittest
        working-directory: log-summary
        shell: bash
        env:
          MEASURE_COVERAGE: ${{ matrix.platform == 'Ubuntu' && matrix.python == '3.14' }}
          COVERAGE_FILE: ${{ runner.temp }}/log-summary.coverage
        run: |
          if [[ "$MEASURE_COVERAGE" == "true" ]]; then
            python -m coverage run -m unittest -v 2>&1 | tee "$RUNNER_TEMP/log-summary-unittest.log"
          else
            python -m unittest -v 2>&1 | tee "$RUNNER_TEMP/log-summary-unittest.log"
          fi

      - name: Publish line and branch coverage
        if: ${{ !cancelled() && matrix.platform == 'Ubuntu' && matrix.python == '3.14' && steps.unittest.outcome == 'success' }}
        working-directory: log-summary
        shell: bash
        env:
          COVERAGE_FILE: ${{ runner.temp }}/log-summary.coverage
        run: |
          python -m coverage combine
          python -m coverage json -o "$RUNNER_TEMP/log-summary-coverage.json"
          python - "$RUNNER_TEMP/log-summary-coverage.json" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import sys
          from pathlib import Path

          totals = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))["totals"]
          print("### Log Summary coverage (Ubuntu, Python 3.14)\n")
          print("| Metric | Covered / Total | Coverage |")
          print("| --- | ---: | ---: |")
          for label, covered_key, total_key in (
              ("Lines", "covered_lines", "num_statements"),
              ("Branches", "covered_branches", "num_branches"),
          ):
              covered, total = totals[covered_key], totals[total_key]
              percentage = f"{covered / total:.1%}" if total else "N/A"
              print(f"| {label} | {covered} / {total} | {percentage} |")
          PY

      - name: Summarize unit tests
        if: always()
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          PYTHON_VERSION: ${{ matrix.python }}
          TEST_OUTCOME: ${{ steps.unittest.outcome }}
        run: |
          {
            printf '### Unit tests on %s (Python %s)\n\n' "$PLATFORM" "$PYTHON_VERSION"
            printf 'Outcome: **%s**\n\n' "$TEST_OUTCOME"
            if [[ -f "$RUNNER_TEMP/log-summary-unittest.log" ]]; then
              grep -E '^Ran [0-9]+ tests? in ' "$RUNNER_TEMP/log-summary-unittest.log" || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  rhel8-user-space:
    name: Unit tests / Red Hat UBI 8 / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run tests in Red Hat UBI 8
        shell: bash
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/log-summary:/workspace:ro" \
            --workdir /workspace \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env PYTHONUTF8=1 \
            --entrypoint /usr/bin/python3.12 \
            registry.access.redhat.com/ubi8/python-312:latest \
            -m unittest -v

  code-quality:
    name: Code quality / Ruff and mypy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ruff and mypy
        id: tools
        run: python -m pip install ruff==0.11.13 mypy==1.19.1

      - name: Lint with Ruff
        id: lint
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        working-directory: log-summary
        run: python -m ruff check log_summary.py test_log_summary.py

      - name: Type check with mypy
        id: types
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        working-directory: log-summary
        run: python -m mypy --python-version 3.12 log_summary.py

      - name: Summarize code quality
        if: always()
        shell: bash
        env:
          TOOLS_OUTCOME: ${{ steps.tools.outcome }}
          RUFF_OUTCOME: ${{ steps.lint.outcome }}
          MYPY_OUTCOME: ${{ steps.types.outcome }}
        run: |
          {
            printf '### Code quality (Ubuntu, Python 3.12)\n\n'
            printf '| Check | Outcome |\n| --- | --- |\n'
            printf '| Install check tools | %s |\n' "$TOOLS_OUTCOME"
            printf '| Ruff lint | %s |\n' "$RUFF_OUTCOME"
            printf '| mypy type check | %s |\n' "$MYPY_OUTCOME"
          } >> "$GITHUB_STEP_SUMMARY"
